name: validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: registry
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StokerHQ/schemas
          path: schemas
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the validator's requirements
        run: python -m pip install "jsonschema[format-nongpl]" pyyaml
      - name: Validate the registry
        run: python -I schemas/validate.py registry
  # The compiled index is published only by the operator, after signing it locally (README, "Publishing a version"):
  # nothing here builds or deploys it.
